        ];

        // 2. 눈 효과 생성
        function createSnow() {
            const container = document.getElementById('snow-container');
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                const flake = document.createElement('div');
                flake.className = 'absolute bg-white rounded-full opacity-70 animate-fall';
                
                const left = Math.random() * 100;
                const topOffset = Math.random() * 20;
                const size = Math.random() * 4 + 2;
                const duration = Math.random() * 10 + 5;
                const delay = Math.random() * 10;

                flake.style.left = `${left}%`;
                flake.style.top = `-${topOffset}px`;
                flake.style.width = `${size}px`;
                flake.style.height = `${size}px`;
                flake.style.animationDuration = `${duration}s`;
                flake.style.animationDelay = `${delay}s`;

                container.appendChild(flake);
            }
        }

        // 3. 오너먼트 렌더링
        function renderOrnaments() {
            const container = document.getElementById('ornaments-container');
            
            bookData.forEach(book => {
                const btn = document.createElement('button');
                btn.className = 'absolute transform -translate-x-1/2 -translate-y-1/2 hover:scale-110 transition-all duration-300 cursor-pointer group focus:outline-none z-40';
                btn.style.top = book.position.top;
                btn.style.left = book.position.left;
                btn.onclick = () => handleBookClick(book);
                btn.setAttribute('aria-label', `${book.title} 책 보기`);

                btn.innerHTML = `
                    <div class="relative">
                        <div class="w-12 h-12 rounded-full ornament-ring flex items-center justify-center border-4 border-white/50">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br ${book.gradient} flex items-center justify-center shadow-inner">
                                <div class="relative z-10 animate-pulse-slow drop-shadow-sm">
                                    <i data-lucide="${book.icon}" class="${book.iconColor}" width="20" height="20"></i>
                                </div>
                            </div>
                        </div>
                        <div class="absolute -top-2 left-1/2 -translate-x-1/2 w-2 h-3 bg-gradient-to-b from-amber-300 to-amber-500 rounded-t-full shadow-md"></div>
                    </div>
                    
                    <div class="opacity-0 group-hover:opacity-100 absolute bottom-full left-1/2 -translate-x-1/2 mb-2 text-[10px] bg-white text-slate-900 px-2 py-1 rounded-lg font-bold shadow-lg whitespace-nowrap transition-opacity pointer-events-none transform translate-y-2 group-hover:translate-y-0 z-50">
                        Pick me!
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        // 4. 페이지 전환 및 데이터 표시
        const mainContent = document.getElementById('main-content');
        const homeView = document.getElementById('home-view');
        const detailView = document.getElementById('detail-view');

        function handleBookClick(book) {
            mainContent.classList.add('opacity-0'); // 페이드 아웃
            
            setTimeout(() => {
                homeView.classList.add('hidden');
                detailView.classList.remove('hidden');
                
                // 데이터 채우기
                document.getElementById('detail-title').innerText = book.title;
                document.getElementById('detail-author-year').innerText = `${book.author} | ${book.year}`;
                document.getElementById('detail-callnumber').innerText = book.callNumber;
                document.getElementById('detail-desc').innerText = `"${book.desc}"`;
                document.getElementById('detail-link').href = book.link;

                // 이미지 처리 (에러 시 컬러 표지로 대체)
                const coverContainer = document.getElementById('book-cover-container');
                if (book.image) {
                    coverContainer.className = `w-44 h-64 rounded-r-xl rounded-l-md shadow-2xl mb-8 relative flex flex-col items-center justify-center p-0 text-center transform transition-transform duration-500 hover:rotate-y-12 overflow-hidden`;
                    // 이미지 로드 실패 시 대체 콘텐츠 표시 로직 포함
                    coverContainer.innerHTML = `
                        <img src="${book.image}" alt="${book.title}" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                        <div class="hidden absolute inset-0 ${book.coverColor} flex-col items-center justify-center p-4">
                            <div class="absolute left-0 top-0 bottom-0 w-3 bg-black/20 rounded-l-md z-10 backdrop-blur-sm"></div>
                            <div class="absolute left-3 top-0 bottom-0 w-[1px] bg-white/10 z-10"></div>
                            <div class="mb-4 p-3 rounded-full bg-white/10 backdrop-blur-sm shadow-inner p-4">
                                <i data-lucide="${book.icon}" width="32" height="32" class="text-white"></i>
                            </div>
                            <h3 class="text-white font-paperlogy-bold text-lg leading-tight line-clamp-2 drop-shadow-md z-20">${book.title}</h3>
                        </div>
                        <div class="absolute left-0 top-0 bottom-0 w-3 bg-black/20 rounded-l-md z-10 backdrop-blur-sm pointer-events-none"></div>
                        <div class="absolute left-3 top-0 bottom-0 w-[1px] bg-white/10 z-10 pointer-events-none"></div>
                    `;
                    lucide.createIcons(); // 동적 아이콘 렌더링
                } else {
                    // 이미지 없을 때
                    coverContainer.className = `w-44 h-64 ${book.coverColor} rounded-r-xl rounded-l-md shadow-2xl mb-8 relative flex flex-col items-center justify-center p-0 text-center transform transition-transform duration-500 hover:rotate-y-12 overflow-hidden`;
                    coverContainer.innerHTML = `
                        <div class="absolute left-0 top-0 bottom-0 w-3 bg-black/20 rounded-l-md z-10 backdrop-blur-sm"></div>
                        <div class="absolute left-3 top-0 bottom-0 w-[1px] bg-white/10 z-10"></div>
                        <div class="mb-4 p-3 rounded-full bg-white/10 backdrop-blur-sm shadow-inner p-4">
                           <i data-lucide="${book.icon}" width="32" height="32" class="text-white"></i>
                        </div>
                        <h3 class="text-white font-paperlogy-bold text-lg leading-tight line-clamp-2 drop-shadow-md px-4">${book.title}</h3>
                        <p class="mt-2 text-white/80 text-xs font-medium px-4">${book.author}</p>
                    `;
                    lucide.createIcons();
                }

                mainContent.classList.remove('opacity-0'); // 페이드 인
            }, 300);
        }

        function goBack() {
            mainContent.classList.add('opacity-0');
            setTimeout(() => {
                detailView.classList.add('hidden');
                homeView.classList.remove('hidden');
                mainContent.classList.remove('opacity-0');
            }, 300);
        }

        // 5. 오디오 로직 (가장 중요)
        const audio = document.getElementById('bg-music');
        const iconVolumeOff = document.getElementById('icon-volume-off');
        const iconVolumeOn = document.getElementById('icon-volume-on');
        const volumeSlider = document.getElementById('volume-slider');
        
        let isMuted = false;
        let isPlaying = false;

        // 볼륨 슬라이더
        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            audio.volume = val;
            
            if (val == 0) {
                isMuted = true;
                audio.muted = true;
                updateVolumeIcon(true);
            } else {
                if (isMuted) {
                    isMuted = false;
                    audio.muted = false;
                    updateVolumeIcon(false);
                }
                if (audio.paused) {
                    audio.play().then(() => isPlaying = true).catch(() => {});
                }
            }
        });

        // 음소거 토글
        document.getElementById('music-btn').addEventListener('click', () => {
            if (isMuted) {
                audio.muted = false;
                audio.volume = volumeSlider.value > 0 ? volumeSlider.value : 0.5;
                volumeSlider.value = audio.volume;
                if (audio.paused) audio.play().then(() => isPlaying = true).catch(() => {});
                isMuted = false;
                updateVolumeIcon(false);
            } else {
                audio.muted = true;
                isMuted = true;
                volumeSlider.value = 0;
                updateVolumeIcon(true);
            }
        });

        function updateVolumeIcon(muted) {
            if (muted) {
                iconVolumeOff.classList.remove('hidden');
                iconVolumeOn.classList.add('hidden');
            } else {
                iconVolumeOff.classList.add('hidden');
                iconVolumeOn.classList.remove('hidden');
            }
        }

        // 초기화 및 첫 실행
        window.addEventListener('DOMContentLoaded', () => {
            createSnow();
            renderOrnaments();
            lucide.createIcons();
            
            audio.volume = 0.5;

            // 브라우저 자동 재생 정책 우회: 첫 클릭 시 재생
            window.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play().then(() => isPlaying = true).catch(() => {});
                }
            }, { once: true });
        });

    </script>
</body>
